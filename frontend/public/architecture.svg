<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="morph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="x402" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">AgentPay SEA — Architecture Diagram</text>
  <text x="600" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">x402 Agentic Payments on Morph Network</text>

  <!-- Client Layer -->
  <rect x="40" y="90" width="1120" height="160" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="115" fill="#f8fafc" font-size="14" font-weight="bold">👤 CLIENT LAYER</text>

  <!-- User boxes -->
  <rect x="80" y="135" width="200" height="90" rx="8" fill="#0f172a" stroke="#475569" filter="url(#shadow)"/>
  <text x="180" y="165" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Freelancer</text>
  <text x="180" y="185" text-anchor="middle" fill="#94a3b8" font-size="11">Sends tasks</text>
  <text x="180" y="200" text-anchor="middle" fill="#94a3b8" font-size="11">Deposits USDC</text>

  <rect x="340" y="135" width="200" height="90" rx="8" fill="#0f172a" stroke="#475569" filter="url(#shadow)"/>
  <text x="440" y="165" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Business Owner</text>
  <text x="440" y="185" text-anchor="middle" fill="#94a3b8" font-size="11">Hires agents</text>
  <text x="440" y="200" text-anchor="middle" fill="#94a3b8" font-size="11">Sets budgets</text>

  <rect x="600" y="135" width="200" height="90" rx="8" fill="#0f172a" stroke="#475569" filter="url(#shadow)"/>
  <text x="700" y="165" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">AI Agent</text>
  <text x="700" y="185" text-anchor="middle" fill="#94a3b8" font-size="11">Executes tasks</text>
  <text x="700" y="200" text-anchor="middle" fill="#94a3b8" font-size="11">Pays APIs via x402</text>

  <rect x="860" y="135" width="200" height="90" rx="8" fill="#0f172a" stroke="#475569" filter="url(#shadow)"/>
  <text x="960" y="165" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Global Client</text>
  <text x="960" y="185" text-anchor="middle" fill="#94a3b8" font-size="11">Pays in USDC</text>
  <text x="960" y="200" text-anchor="middle" fill="#94a3b8" font-size="11">No bank delays</text>

  <!-- Frontend Layer -->
  <rect x="40" y="280" width="1120" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="305" fill="#f8fafc" font-size="14" font-weight="bold">🖥️ FRONTEND (Next.js 14 + TypeScript)</text>

  <rect x="80" y="320" width="160" height="85" rx="8" fill="#0f172a" stroke="#475569" filter="url(#shadow)"/>
  <text x="160" y="348" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">Marketplace</text>
  <text x="160" y="365" text-anchor="middle" fill="#94a3b8" font-size="10">Browse agents</text>
  <text x="160" y="380" text-anchor="middle" fill="#94a3b8" font-size="10">Buy subscriptions</text>

  <rect x="270" y="320" width="160" height="85" rx="8" fill="#0f172a" stroke="#475569" filter="url(#shadow)"/>
  <text x="350" y="348" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">Wallet Connect</text>
  <text x="350" y="365" text-anchor="middle" fill="#94a3b8" font-size="10">RainbowKit</text>
  <text x="350" y="380" text-anchor="middle" fill="#94a3b8" font-size="10">Wagmi</text>

  <rect x="460" y="320" width="160" height="85" rx="8" fill="#0f172a" stroke="#475569" filter="url(#shadow)"/>
  <text x="540" y="348" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">Payment Flow</text>
  <text x="540" y="365" text-anchor="middle" fill="#94a3b8" font-size="10">Approve → Deposit</text>
  <text x="540" y="380" text-anchor="middle" fill="#94a3b8" font-size="10">→ Confirm</text>

  <rect x="650" y="320" width="160" height="85" rx="8" fill="#0f172a" stroke="#475569" filter="url(#shadow)"/>
  <text x="730" y="348" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">Agent Chat</text>
  <text x="730" y="365" text-anchor="middle" fill="#94a3b8" font-size="10">Markdown rendering</text>
  <text x="730" y="380" text-anchor="middle" fill="#94a3b8" font-size="10">Multi-provider AI</text>

  <rect x="840" y="320" width="160" height="85" rx="8" fill="#0f172a" stroke="#475569" filter="url(#shadow)"/>
  <text x="920" y="348" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">Dashboard</text>
  <text x="920" y="365" text-anchor="middle" fill="#94a3b8" font-size="10">API Keys</text>
  <text x="920" y="380" text-anchor="middle" fill="#94a3b8" font-size="10">Purchase history</text>

  <!-- API Layer -->
  <rect x="40" y="460" width="1120" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="485" fill="#f8fafc" font-size="14" font-weight="bold">⚙️ BACKEND API (Next.js API Routes)</text>

  <rect x="80" y="500" width="140" height="85" rx="8" fill="#0f172a" stroke="#475569" filter="url(#shadow)"/>
  <text x="150" y="528" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">/api/checkout</text>
  <text x="150" y="545" text-anchor="middle" fill="#94a3b8" font-size="10">Create purchase</text>
  <text x="150" y="560" text-anchor="middle" fill="#94a3b8" font-size="10">Lock escrow</text>

  <rect x="240" y="500" width="140" height="85" rx="8" fill="#0f172a" stroke="#475569" filter="url(#shadow)"/>
  <text x="310" y="528" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">/api/agent</text>
  <text x="310" y="545" text-anchor="middle" fill="#94a3b8" font-size="10">/execute</text>
  <text x="310" y="560" text-anchor="middle" fill="#94a3b8" font-size="10">Multi-LLM routing</text>

  <rect x="400" y="500" width="140" height="85" rx="8" fill="#0f172a" stroke="#475569" filter="url(#shadow)"/>
  <text x="470" y="528" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">/api/service</text>
  <text x="470" y="545" text-anchor="middle" fill="#94a3b8" font-size="10">-access</text>
  <text x="470" y="560" text-anchor="middle" fill="#94a3b8" font-size="10">Token management</text>

  <rect x="560" y="500" width="140" height="85" rx="8" fill="#0f172a" stroke="#475569" filter="url(#shadow)"/>
  <text x="630" y="528" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">In-Memory</text>
  <text x="630" y="545" text-anchor="middle" fill="#94a3b8" font-size="10">Data Store</text>
  <text x="630" y="560" text-anchor="middle" fill="#94a3b8" font-size="10">+ Zustand cache</text>

  <rect x="720" y="500" width="140" height="85" rx="8" fill="#0f172a" stroke="#475569" filter="url(#shadow)"/>
  <text x="790" y="528" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">/api/x402</text>
  <text x="790" y="545" text-anchor="middle" fill="#94a3b8" font-size="10">x402 facilitator</text>
  <text x="790" y="560" text-anchor="middle" fill="#94a3b8" font-size="10">Payment requests</text>

  <rect x="880" y="500" width="160" height="85" rx="8" fill="#0f172a" stroke="#475569" filter="url(#shadow)"/>
  <text x="960" y="528" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">/api/webhooks</text>
  <text x="960" y="545" text-anchor="middle" fill="#94a3b8" font-size="10">Hydrate</text>
  <text x="960" y="560" text-anchor="middle" fill="#94a3b8" font-size="10">Sync fallback</text>

  <!-- Blockchain Layer -->
  <rect x="40" y="640" width="1120" height="230" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="665" fill="#f8fafc" font-size="14" font-weight="bold">⛓️ BLOCKCHAIN LAYER (Morph Hoodi Testnet — Chain ID 2910)</text>

  <!-- Morph network box -->
  <rect x="80" y="685" width="1120" height="170" rx="8" fill="#0f172a" stroke="#2563eb" stroke-dasharray="4" filter="url(#shadow)"/>
  <text x="640" y="710" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="bold">Morph Network (EVM L2) — Settlement Layer</text>

  <!-- Contract boxes -->
  <rect x="120" y="730" width="280" height="100" rx="8" fill="#1e3a5f" stroke="#2563eb" filter="url(#shadow)"/>
  <text x="260" y="758" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">📄 Escrow Contract</text>
  <text x="260" y="778" text-anchor="middle" fill="#93c5fd" font-size="10">0xd04a...3e6</text>
  <text x="260" y="798" text-anchor="middle" fill="#94a3b8" font-size="10">Holds USDC in escrow</text>
  <text x="260" y="813" text-anchor="middle" fill="#94a3b8" font-size="10">Releases on task completion</text>

  <rect x="450" y="730" width="280" height="100" rx="8" fill="#1e3a5f" stroke="#2563eb" filter="url(#shadow)"/>
  <text x="590" y="758" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">🤖 x402Facilitator</text>
  <text x="590" y="778" text-anchor="middle" fill="#93c5fd" font-size="10">0x44b9...76d</text>
  <text x="590" y="798" text-anchor="middle" fill="#94a3b8" font-size="10">HTTP 402 payment handler</text>
  <text x="590" y="813" text-anchor="middle" fill="#94a3b8" font-size="10">Agent → API micropayments</text>

  <rect x="780" y="730" width="280" height="100" rx="8" fill="#1e3a5f" stroke="#2563eb" filter="url(#shadow)"/>
  <text x="920" y="758" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">💰 MockUSDC</text>
  <text x="920" y="778" text-anchor="middle" fill="#93c5fd" font-size="10">0x6d4d...9ea</text>
  <text x="920" y="798" text-anchor="middle" fill="#94a3b8" font-size="10">ERC-20 stablecoin</text>
  <text x="920" y="813" text-anchor="middle" fill="#94a3b8" font-size="10">Testnet faucet</text>

  <!-- Arrows/connections -->
  <!-- Client → Frontend -->
  <line x1="180" y1="225" x2="180" y2="320" stroke="#475569" stroke-width="1.5"/>
  <line x1="440" y1="225" x2="440" y2="320" stroke="#475569" stroke-width="1.5"/>
  <line x1="700" y1="225" x2="700" y2="320" stroke="#475569" stroke-width="1.5"/>
  <line x1="960" y1="225" x2="960" y2="320" stroke="#475569" stroke-width="1.5"/>

  <!-- Frontend → Backend -->
  <line x1="160" y1="405" x2="160" y2="500" stroke="#475569" stroke-width="1.5"/>
  <line x1="350" y1="405" x2="310" y2="500" stroke="#475569" stroke-width="1.5"/>
  <line x1="540" y1="405" x2="470" y2="500" stroke="#475569" stroke-width="1.5"/>
  <line x1="730" y1="405" x2="630" y2="500" stroke="#475569" stroke-width="1.5"/>
  <line x1="920" y1="405" x2="960" y2="500" stroke="#475569" stroke-width="1.5"/>

  <!-- Backend → Blockchain -->
  <line x1="150" y1="585" x2="260" y2="730" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="310" y1="585" x2="440" y2="730" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="630" y1="585" x2="920" y2="730" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- x402 Faclitator → External APIs -->
  <path d="M 590 830 L 590 860 L 800 860 L 800 870" stroke="#10b981" stroke-width="1.5" fill="none" stroke-dasharray="4"/>
  <text x="800" y="858" fill="#10b981" font-size="10">→ x402 payment requests</text>

  <!-- External APIs box -->
  <rect x="820" y="680" width="10" height="10" fill="transparent"/>

  <!-- Legend -->
  <rect x="40" y="880" width="1120" height="20" rx="4" fill="transparent"/>
  <rect x="60" y="883" width="10" height="10" rx="2" fill="#2563eb"/>
  <text x="75" y="893" fill="#94a3b8" font-size="10">On-chain tx</text>
  <rect x="160" y="883" width="10" height="10" rx="2" fill="#10b981"/>
  <text x="175" y="893" fill="#94a3b8" font-size="10">x402 payment</text>
  <rect x="270" y="883" width="10" height="10" rx="2" fill="#475569"/>
  <text x="285" y="893" fill="#94a3b8" font-size="10">HTTP/API call</text>
  <text x="440" y="893" fill="#64748b" font-size="10">Hackathon: Build In! Payments — Morph × Blockchain4Youth × DvCode Technologies Inc.</text>
</svg>